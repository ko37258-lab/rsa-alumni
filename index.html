  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  button { font-family: inherit; }
  #initial-loader { position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #FAF9F5; z-index: 9999; gap: 16px; }
  #initial-loader .spinner { width: 40px; height: 40px; border: 3px solid #E2E8F0; border-top-color: #D97757;
    border-radius: 50%; animation: spin 0.8s linear infinite; }
  #initial-loader .text { font-size: 13px; color: #64748B; font-weight: 600; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<style id="claude-style-overrides">
  :root{
    --claude-coral:#D97757;
    --claude-coral-dark:#C96442;
    --claude-coral-darker:#B5532D;
    --claude-cream:#FAF9F5;
    --claude-cream-warm:#F5F4ED;
    --claude-surface:#F0EEE6;
    --claude-ink:#1F1E1D;
    --claude-ink-soft:#5C5B57;
    --claude-line:#E8E6DC;
  }
  html, body{ background:var(--claude-cream); }
  body{
    color:var(--claude-ink);
    -webkit-font-smoothing:antialiased;
    font-feature-settings:"ss01","ss02";
  }
  /* Claude는 라운드를 토스보다 살짝 작게 */
  .rounded-3xl{ border-radius:18px !important; }
  .rounded-2xl{ border-radius:14px !important; }
  /* 카드 그림자를 더 부드럽게 */
  .shadow, .shadow-sm, .shadow-md{
    box-shadow:0 1px 2px rgba(31,30,29,0.04), 0 1px 1px rgba(31,30,29,0.03) !important;
  }
  .shadow-lg{
    box-shadow:0 4px 16px rgba(31,30,29,0.06), 0 1px 2px rgba(31,30,29,0.04) !important;
  }
  .shadow-xl, .shadow-2xl{
    box-shadow:0 10px 32px rgba(31,30,29,0.08), 0 2px 6px rgba(31,30,29,0.04) !important;
  }
  /* 스크롤바 (Claude는 매우 미니멀) */
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-thumb{ background:#D4D2C7; border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover{ background:#B8B6A9; }
  ::-webkit-scrollbar-track{ background:transparent; }
  /* Selection */
  ::selection{ background:#F5E2D2; color:#1F1E1D; }
  /* Claude 헤딩 톤 (살짝 묵직하게) */
  h1, h2, h3{ letter-spacing:-0.02em; }
  /* 입력 포커스 링을 코랄로 */
  input:focus, textarea:focus, select:focus{
    outline:none;
  }
  /* 흰색 카드를 살짝 따뜻하게 (선택적) */
  .bg-white{ background:#FFFFFF !important; }
  /* 회색 텍스트를 따뜻한 잉크 톤으로 */
  .text-gray-900{ color:var(--claude-ink) !important; }
  .text-gray-800{ color:#2A2926 !important; }
  .text-gray-700{ color:#3D3B37 !important; }
  .text-gray-600{ color:#5C5B57 !important; }
  .text-gray-500{ color:#787671 !important; }
  .text-gray-400{ color:#9D9B92 !important; }
  /* 보더 컬러 */
  .border-gray-200{ border-color:#E8E6DC !important; }
  .border-gray-100{ border-color:#EFEDE3 !important; }
  /* 회색 배경들 */
  .bg-gray-50{ background:#FAF9F5 !important; }
  .bg-gray-100{ background:#F5F4ED !important; }
  .bg-gray-200{ background:#EBE9DE !important; }
</style>
</head>
